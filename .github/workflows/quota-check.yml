name: YouTube Quota Check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: quota-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Run quota check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GCP_SA_LIVEMORE_505306: ${{ secrets.GCP_SA_LIVEMORE_505306 }}
          GCP_SA_LIVEMORE_504508: ${{ secrets.GCP_SA_LIVEMORE_504508 }}
          GCP_SA_RD_LIVE_507401: ${{ secrets.GCP_SA_RD_LIVE_507401 }}
          GCP_SA_LIVE_4TH: ${{ secrets.GCP_SA_LIVE_4TH }}
          GCP_SA_POLITALTAL: ${{ secrets.GCP_SA_POLITALTAL }}
          GCP_SA_ACTIVE_COSINE: ${{ secrets.GCP_SA_ACTIVE_COSINE }}
        run: npm run check

      - name: Commit dashboard data
        run: |
          git config user.name "yt-quota-bot"
          git config user.email "288308157+jihoony82@users.noreply.github.com"
          git add docs/data.json docs/alert-state.json
          git diff --cached --quiet || git commit -m "chore: update quota data"
          git push
